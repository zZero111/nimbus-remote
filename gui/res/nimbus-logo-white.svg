<?xml version="1.0" encoding="UTF-8"?>
<!-- Nimbus Remote mark: a cloud carrying a play symbol, with the wordmark below. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="400" viewBox="0 0 512 400">
  <g fill="none" stroke="#ffffff" stroke-width="18" stroke-linejoin="round" stroke-linecap="round">
    <!-- cloud outline -->
    <path d="M150 250
             C 100 250, 78 214, 92 182
             C 104 154, 134 144, 156 150
             C 162 104, 204 74, 250 78
             C 292 82, 322 110, 330 146
             C 372 136, 418 162, 420 206
             C 422 236, 398 250, 372 250 Z"/>
  </g>
  <!-- play symbol inside the cloud -->
  <path d="M232 140 L 304 182 L 232 224 Z" fill="#ffffff"/>
  <!-- signal arcs to the right, the remote part -->
  <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
    <path d="M440 120 A 70 70 0 0 1 470 180"/>
    <path d="M454 84 A 110 110 0 0 1 498 186"/>
  </g>
  <text x="256" y="350" text-anchor="middle" fill="#ffffff"
        font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-weight="700" font-size="64"
        letter-spacing="2">Nimbus Remote</text>
</svg>
